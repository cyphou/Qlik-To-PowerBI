name: Openability Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  openability-check:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run openability batch gate
        shell: pwsh
        run: |
          ./scripts/run_openability_batch.ps1 `
            -InputRoot "./examples/qlik" `
            -OutputRoot "./artifacts/ci_openability" `
            -Recursive `
            -FailOnNonOpenable

      - name: Upload openability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openability-reports
          path: |
            artifacts/ci_openability/openability_batch_report.json
            artifacts/ci_openability/openability_batch_report.csv
